<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Автоперевод страницы браузером переписывает DOM и роняет React (insertBefore NotFoundError) -->
<meta name="google" content="notranslate">
<title>CA Research</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; }
#root { max-width: 840px; margin: 0 auto; padding: 2rem 1rem; }
input, textarea, select { font-family: inherit; font-size: 13px; border: 1px solid #ddd; border-radius: 8px; padding: 8px 11px; background: #fff; color: #111; outline: none; width: 100%; transition: border 0.15s; }
input:focus, textarea:focus, select:focus { border-color: #378ADD; }
button { font-family: inherit; font-size: 13px; border: 1px solid #ddd; border-radius: 8px; padding: 7px 14px; background: #fff; color: #111; cursor: pointer; transition: background 0.12s; }
button:hover:not(:disabled) { background: #f0f0f0; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
.btn-primary { background: #111; color: #fff; border-color: #111; font-weight: 500; }
.btn-primary:hover:not(:disabled) { background: #333; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th { padding: 6px 9px; background: #f8f8f8; border: 1px solid #eee; text-align: left; font-weight: 500; white-space: normal; min-width: 80px; line-height: 1.3; }
td { padding: 6px 9px; border: 1px solid #eee; vertical-align: top; word-break: break-word; white-space: normal; max-width: 200px; line-height: 1.4; }
tr:nth-child(even) td { background: #fafafa; }
.tag { font-size: 10px; padding: 2px 7px; border-radius: 4px; border: 1px solid; display: inline-block; }
.status-bar { background: #111; color: #fff; border-radius: 10px; padding: 14px 18px; margin-bottom: 12px; }
.timer { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tooltip-box { font-size: 12px; color: #555; background: #f8f8f8; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px 12px; margin-top: 4px; line-height: 1.5; }
.info-btn { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #ccc; background: #fff; cursor: pointer; font-size: 10px; color: #888; padding: 0; display: inline-flex; align-items: center; justify-content: center; margin-left: 5px; flex-shrink: 0; }
.info-btn:hover { background: #f0f0f0; }
.field-label-row { display: flex; align-items: center; margin-bottom: 4px; }
.field-label { font-size: 11px; color: #666; font-weight: 500; }
.field-opt { font-size: 10px; color: #aaa; margin-left: 6px; }
</style>
</head>
<body>
<div id="root"></div>
<!-- Контракт с контент-машиной вынесен отдельным файлом: это граница между
     модулями, её нельзя держать вперемешку с интерфейсом. Обычный <script>,
     без сборки — как и весь остальной проект. -->
<script src="lib/contract.js"></script>
<script src="lib/auth.js"></script>
<script src="app.js"></script>
</body>
</html>
