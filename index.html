<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Автоперевод страницы браузером переписывает DOM и роняет React (insertBefore NotFoundError) -->
<meta name="google" content="notranslate">
<title>CA Research</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- Токены эталона, НЕ полный стиль отчёта: страничные правила отчёта
     (.card, .main, .side) в инструменте перебивали его собственную
     раскладку — «плашка на плашке» у владелицы 14.09. Блочные стили
     отчёта инструмент подключает сам, с ограничением области .rview. -->
<script>
/* Внутри платформы инструмент следует теме ПЛАТФОРМЫ, а не системе: платформа
   сейчас светлая, а тёмная система переключала рамку в тёмные токены — и
   данные брифа ложились на чёрный фон под светлой жемчужной плашкой. */
try{if(new URLSearchParams(location.search).get('embed')==='1'){
  document.documentElement.setAttribute('data-theme','light');
  /* Внутри платформы рамка НЕ красит свой фон: иначе поверх жемчужного фона
     платформы ложится сплошная плита, и плашка-заголовок читается как
     «плашка на плашке» (владелица 15.09: «вынеси перламутровую отдельно на
     фон, не надо плашка на плашке»). */
  document.documentElement.setAttribute('data-embed','1');
}}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="lib/tokens.css?v=cf9db2aa">
<link rel="stylesheet" href="lib/nacre.css?v=d8b962d4">
<link rel="stylesheet" href="lib/niches.css?v=ea24fecd">
<link rel="stylesheet" href="lib/buttons.css?v=87ce7a93">
<style>
/* Оформление инструмента — ЭТАЛОН, тот же, что у отчёта и платформы
   (lib/report.css подключён выше). Здесь только то, чего в нём нет: поля
   ввода, служебные плашки прогона, подсказки.

   До 14.09 инструмент нёс своё серое оформление двухлетней давности: #f5f5f5,
   синие рамки, плоские таблицы. Владелица открывала платформу и видела его
   внутри перламутровой оболочки — «старая хуйня» дословно, и справедливо. */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); font-size: var(--fs-body); color: var(--ink);
  background: var(--mist-1); line-height: 1.5; }
#root { max-width: 1180px; margin: 0 auto; padding: 26px 24px 70px; }

input, textarea, select {
  font-family: inherit; font-size: var(--fs-small); color: var(--ink);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px;
  background: var(--card-solid); width: 100%; }
input:focus, textarea:focus, select:focus {
  outline: none; border-color: var(--mid);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--mid) 18%, transparent); }
textarea { min-height: 90px; resize: vertical; }

/* Кнопки — конструкция из оболочки: главная графитом, обычная тонкой рамкой
   с мягким градиентом. Синие рамки и плоский серый убраны. */
button { font-family: var(--sans); font-size: var(--fs-base); font-weight: 600;
  color: var(--ink); cursor: pointer; border: 1px solid var(--line);
  border-radius: 12px; padding: 9px 17px;
  background: linear-gradient(180deg, var(--card-solid),
    color-mix(in srgb, var(--card-solid) 93%, var(--ink)));
  transition: background .16s ease, border-color .16s ease; }
button:hover:not(:disabled) { border-color: var(--ink-3); }
button:disabled { opacity: .45; cursor: default; }
.btn-primary { color: #FFFFFF; border: 2px solid #0D0C0A; padding: 8px 16px;
  background: linear-gradient(180deg, #262320, #171512); }
.btn-primary:hover:not(:disabled) { border-color: var(--mid);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--mid) 22%, transparent); }

.card { background: var(--card-solid); border: 1px solid var(--line);
  border-radius: 22px; padding: 22px 24px; margin-bottom: 14px;
  box-shadow: inset 0 1px 0 var(--hi); }

/* Таблицы — одна шапка на весь проект: прописные под волосяной линией. */
table { border-collapse: collapse; width: 100%; font-size: var(--fs-small); }
th { padding: 13px 18px 9px; font-size: var(--fs-label); font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3);
  text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 18px; border-top: 1px solid var(--line-2);
  color: var(--ink-2); vertical-align: middle; }
tr:nth-child(even) td { background: none; }

.tag { display: inline-block; font-size: var(--fs-label); font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.status-bar { position: sticky; top: 0; z-index: 20; padding: 14px 18px;
  border-radius: 22px; margin-bottom: 14px;
  background: var(--card-solid);
  border: 1px solid var(--line); font-size: var(--fs-small);
  box-shadow: inset 0 1px 0 var(--hi); }
/* Узкое окно: счётчик уходит под текст шага, а не жмёт его в колонку
   шириной в одно слово (владелица 17.09). */
@media (max-width: 620px) {
  .status-bar > div:last-child { grid-template-columns: 1fr !important; gap: 12px !important; }
}
.timer { font-variant-numeric: tabular-nums; color: var(--ink-3);
  font-size: 22px; line-height: 1.1; }
/* Счётчик перешёл за оценку: полоса не полная и тихо дышит — видно, что
   работа идёт, а не замерла (владелица 17.09). */
.tmbar.over { animation: tmpulse 1.6s ease-in-out infinite; }
@keyframes tmpulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
@media (prefers-reduced-motion: reduce) { .tmbar.over { animation: none } }
.tooltip-box { position: absolute; z-index: 30; max-width: 320px;
  padding: 12px 14px; border-radius: 14px; background: var(--card-solid);
  border: 1px solid var(--line); font-size: var(--fs-caption);
  color: var(--ink-2); line-height: 1.5;
  box-shadow: 0 18px 34px -22px rgba(45,36,22,.45); }
.info-btn { width: 18px; height: 18px; padding: 0; border-radius: 50%;
  font-size: var(--fs-label); line-height: 1; color: var(--ink-3); }
.info-btn:hover { color: var(--ink); }
.field-label-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
/* Ярлык поля — как все прописные ярлыки эталона: 10px, 700, разрядка .07em.
   Поля брифа выглядели «не в наших шрифтах» ровно потому, что ярлыки жили
   своим кеглем 12.5 — единственные на всю платформу. */
.field-label { font-size: var(--fs-label); font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--ink-3); }
/* Рабочая поверхность этапа: тот же материал, что панель бокового меню
   платформы — владелица сверила цвета, они обязаны совпадать. Шапка-плашка
   стоит отдельно НАД поверхностью, карточки данных лежат на ней. */
.worksurface { background: transparent; border: none; border-radius: 0;
  padding: 0; box-shadow: none; }
.worksurface .card { box-shadow: inset 0 1px 0 var(--hi); }
/* Роль колонки «.main» отчёта здесь играет рабочая поверхность. Часть правил
   эталона привязана именно к .main (кегль и отступы заголовков внутри
   карточек) — без этой связки <h2> в карточке остаётся браузерным, вдвое
   крупнее образца, и страница читается как черновик. Значения взяты из
   эталона дословно: .main > .card h2 и его первый-в-карточке случай. */
.worksurface .card h2 { font-size: 16px; font-weight: 600; margin: 26px 0 8px; }
.worksurface .card > h2:first-of-type { margin-top: 2px; }

/* Отступы между блоками модуля. Правило эталона привязано к колонке .main,
   которой в рамке нет, поэтому заголовки шли вплотную и блоки слипались в
   сплошную ленту — владелица: «всё налеплено, нужны заметные отступы».
   Значения продолжают ряд эталона: там между карточками 30px, здесь между
   блоками 46px — блок крупнее карточки и разделять его надо сильнее.
   Сила селектора важна: стиль отчёта подключается скриптом ПОЗЖЕ и несёт
   «.rview h2{margin:0}» — при равной силе побеждал бы он, и отступы молча
   пропадали. Поэтому у каждого правила здесь два класса: «.rview.модуль». */
.rview.модуль h2 { font-size: 19px; margin: 46px 0 14px; }
.rview.модуль > h2:first-child { margin-top: 4px; }
.rview.модуль h3 { font-size: 15px; margin: 28px 0 10px; }
.rview.модуль h4 { margin: 22px 0 8px; }
.rview.модуль p { margin: 0 0 12px; }
.rview.модуль table, .rview.модуль .tbl, .rview.модуль .dtbl, .rview.модуль .nprof,
.rview.модуль .seg, .rview.модуль .aud, .rview.модуль .kit { margin-bottom: 26px; }
/* Итог модуля стоит первым и отбивается от первого блока сильнее прочего. */
.rview.модуль .msum { margin-bottom: 40px; }

/* Мигание текущего модуля в полосе прогона: единственный признак, по которому
   видно, что работа идёт, пока модуль думает минуту-другую. */
@keyframes ca-пульс { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
@media (prefers-reduced-motion: reduce) { @keyframes ca-пульс { 0%,100% { opacity: 1 } } }
/* Таблица эталона просит минимум 600px ширины — на узкой рамке её должен
   прокручивать свой контейнер, а не страница. */
.worksurface .tbl { overflow-x: auto; }
/* Приписка под данными не должна сливаться с ними: владелица 15.09 —
   «она сейчас сливается со всеми данными, надо отступ побольше или
   звёздочку». Отбиваем чертой, отступом и знаком-звёздочкой. */
.worksurface .card > .note { margin-top: 20px; padding-top: 13px;
  border-top: 1px solid var(--line-2); padding-left: 20px; position: relative; }
.worksurface .card > .note::before { content: "✳"; position: absolute; left: 0;
  top: 12px; color: var(--acc-ink); font-size: 12px; line-height: 1; }

/* ── Встроенный режим: рамка внутри платформы ──────────────────────────────
   Свой фон и свои поля рамка не рисует — их задаёт платформа. Иначе жемчужная
   плашка лежит на собственной плите инструмента, а не на фоне страницы. */
html[data-embed] body { background: transparent; }
html[data-embed] #root { max-width: none; padding: 0; }

/* Перламутр на картах ниш даёт материал, но НЕ позиционирование. .nacre ставит
   position:relative и, загружаясь после tokens.css, перебивал
   .fcard{position:absolute} — все пять карт падали в поток и прятались под
   первой внутри .hero{overflow:hidden}. Владелица: «появляется всего одна».
   Правило короткое, но снимать его нельзя, пока карты перламутровые.
   Сила селектора важна: стиль отчёта подключается скриптом ПОЗЖЕ и приходит
   как «.rview .nacre» — при равной силе побеждал бы он. Поэтому здесь
   «.rview .fcard.nacre»: на класс больше. */
.rview .fcard.nacre, .fcard.nacre { position: absolute; }
/* Шестая и седьмая карты веера. В эталоне их пять (.f1–.f5); владелица 15.09:
   «по бокам много свободного места, как-то лысовато — вставь семь». Крайние
   ниже, дальше и приглушены: глубина держится на трёх признаках сразу, иначе
   веер читается как ступеньки. Геометрия продолжает ряд эталона: шаг тот же,
   отступ сверху и подъём — следующие в той же прогрессии. */
.cover .hero .f0 { top: 92px; z-index: 0;
  --glow: var(--back); --gx: 14%; --gy: 20%; --rise: -58px; }
.cover .hero .f6 { top: 92px; z-index: 0;
  --glow: var(--front); --gx: 86%; --gy: 20%; --rise: -58px; }
.cover .hero .f0, .cover .hero .f6 { opacity: .72; }
.cover .hero .f1, .cover .hero .f5 { opacity: .86; }
/* Шаг веера. В эталоне min(11%, 92px) — при узкой колонке это половина карты,
   а в широкой рамке платформы карты слипались в стопку, и было не понять,
   какая открыта. Разводим шире, но не дальше стрелок: крайние карты упирались
   в края экрана и обрезались (владелица 15.09).
   Считаем предел: веер из семи карт занимает ширину карты плюс шесть шагов,
   и всё это должно уместиться между стрелками — они по 34px у краёв плюс
   отступы, итого 112px. Отсюда шаг не больше (100% − ширина карты − 112px)/6.
   Проверено счётом: при рамке 900–1600px по краям ровно 56px, карты не
   обрезаются и упираются аккурат в стрелки. */
.cover .hero .fcard {
  /* Карта подрастает на широких экранах — иначе по краям оставалась пустота
     («лысовато»). Центрирование считается от ПОЛОВИНЫ ширины карты, поэтому
     половина вынесена в переменную: в эталоне она вшита числом 148px, и при
     другой ширине веер съехал бы вбок. */
  --w: clamp(296px, 21%, 340px);
  --half: calc(var(--w) / 2);
  width: var(--w);
  --step: min(15%, 200px, (100% - var(--w) - 112px) / 6);
}
/* Позиции слотов пересчитаны от --half и --step: те же места, что в эталоне,
   но с плавающей шириной карты. */
.cover .hero .f0 { left: calc(50% - var(--half) - 3 * var(--step)); }
.cover .hero .f1 { left: calc(50% - var(--half) - 2 * var(--step)); }
.cover .hero .f2 { left: calc(50% - var(--half) - 1 * var(--step)); }
.cover .hero .f3 { left: calc(50% - var(--half)); }
.cover .hero .f4 { left: calc(50% - var(--half) + 1 * var(--step)); }
.cover .hero .f5 { left: calc(50% - var(--half) + 2 * var(--step)); }
.cover .hero .f6 { left: calc(50% - var(--half) + 3 * var(--step)); }
/* Веер стал шире и ниже — прибавляем высоту под седьмую пару карт. */
.cover .hero { height: 268px; }

/* Карты в веере стоят лесенкой: верхняя на 30px от верха, крайние на 74px.
   Пустоты сверху быть не должно — поднимаем всю лесенку на 22px, ровно на
   отступ верхней карты. Владелица: «столько места сверху». */
.cover .hero .fcard { margin-top: -22px; }
/* Разбор ниши: на узкой рамке круговая и полосы встают друг под друга,
   иначе полосы сжимаются до нечитаемых огрызков. */
@media (max-width: 700px) {
  .ниша-разбор { grid-template-columns: minmax(0, 1fr) !important; }
}

.field-opt { font-size: var(--fs-caption); color: var(--ink-3); text-transform: none; letter-spacing: 0; }

/* ══ ДАШБОРД НИШИ ══════════════════════════════════════════════════════════
   Формы взяты из эталона (lib/report.css) ДОСЛОВНО по геометрии: плитки
   цифр, карточка с заголовком, дуга-полукруг, карточки этапов, лента цитат,
   таблица с круглыми инициалами. Сам report.css сюда подключать нельзя —
   его страничные правила (.card, .main) перебивают раскладку инструмента,
   поэтому те же правила лежат здесь с префиксом nd-.
   Владелица 19.09: «не похоже на то, что я прошу — сделай красиво, наглядно;
   информация компактно и визуально, а не списками с техпометками». */
.nd { margin-top: 4px; }
/* Раскрытая ниша не рисует свою плашку: внутри лежат карточки эталона, и
   плашка под ними читалась бы как «фон на фоне» (владелица 18.09). */
.nd-open { background: transparent !important; border: none !important;
  box-shadow: none !important; overflow: visible !important; }
.nd-open .nd-head { padding-left: 0 !important; padding-right: 0 !important; }
.nd-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }
.nd-stat { background: var(--card-solid); border: 1px solid var(--line);
  border-radius: 18px; padding: 14px 16px; box-shadow: inset 0 1px 0 var(--hi); min-width: 0; }
.nd-stat .k { font-size: 10.5px; color: var(--ink-3); margin-bottom: 6px; line-height: 1.35; }
.nd-stat .v { font-size: 21px; font-weight: 700; letter-spacing: -.02em; color: var(--ink);
  font-variant-numeric: tabular-nums; line-height: 1.15; overflow-wrap: anywhere; }
.nd-stat .v.long { font-size: 16px; }
.nd-stat .s { font-size: 10px; color: var(--ink-3); margin-top: 5px; line-height: 1.4; }
.nd-grid2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 10px; margin-bottom: 10px; }
/* Ряды, где оба блока равнозначны (кого искали / где сидит аудитория,
   осведомлённость / что ищут) — пополам, иначе правый выглядит обрезком. */
.nd-grid2.even { grid-template-columns: 1fr 1fr; }
/* Одинокий блок в ряду занимает всю ширину: пустое место справа от карты
   рынка владелица 19.09 отметила отдельно. */
.nd-grid2 > *:only-child { grid-column: 1 / -1; }
.nd-card { background: var(--card-solid); border: 1px solid var(--line);
  border-radius: 18px; padding: 16px 18px; box-shadow: inset 0 1px 0 var(--hi); min-width: 0; }
.nd-chead { display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
.nd-chead h3 { font-size: 13px; font-weight: 700; color: var(--ink); margin: 0; }
.nd-chead .n { font-size: 10.5px; color: var(--ink-3); }
/* Полоса — мера эталона: дорожка 14px, шаг 13px, торцы прямые. */
.nd-bars { display: grid; gap: 13px; }
.nd-bar { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) 96px;
  gap: 12px; align-items: center; }
.nd-bar .t { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.nd-bar .t.on { color: var(--ink); font-weight: 600; }
.nd-bar .track { height: 14px; background: var(--line-2); display: block; }
.nd-bar .track i { display: block; height: 100%; background: var(--mid); }
.nd-bar .v { font-size: 12px; font-weight: 600; text-align: right; color: var(--ink);
  font-variant-numeric: tabular-nums; white-space: nowrap; }
/* Дуга осведомлённости — как в эталоне: полукруг, пять ступеней, в центре
   главное число, под ним легенда. */
.nd-arc { display: flex; flex-direction: column; align-items: center; }
.nd-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px;
  color: var(--ink-2); margin-top: 12px; }
.nd-legend i { width: 11px; height: 8px; display: inline-block; margin-right: 6px; }
/* Этапы пути — карточками в ряд, точка задаёт положение на пути. */
.nd-flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }
.nd-stage { background: var(--card-solid); border: 1px solid var(--line);
  border-radius: 18px; padding: 16px 18px; box-shadow: inset 0 1px 0 var(--hi); min-width: 0; }

/* Таблица рынка — круглые инициалы вместо текстовой метки. */

.nd-qstrip { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;

/* Где сидит аудитория — площадки строками со знаком и типом. */
.nd-places { display: grid; gap: 2px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.nd-places > div { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 9px;

.nd-places > div:hover { background: var(--line-2); }
.nd-places .ico svg { width: 15px; height: 15px; fill: none; stroke: var(--ink-3);

.nd-places .ty { font-size: 10px; color: var(--ink-3); white-space: nowrap; }
/* Кого искали — сегмент и три интереса плашками. */

.nd-face { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;

/* Карта рынка — точки, название всплывает при наведении (владелица 19.09:

.nd-map { display: grid; gap: 1px; background: var(--line-2); }
.nd-map > span { background: var(--card-solid); padding: 9px 11px; min-width: 0; }
.nd-map .col { font-size: 10px; letter-spacing: .05em; text-transform: uppercase;

.nd-map .row { font-size: 11px; font-weight: 600; color: var(--ink-2);

.nd-me-leg i { width: 11px; height: 11px; border-radius: 50%; background: var(--mid);

.nd-map .dots i:hover { background: var(--mid); }

   секунду и снизу — владелица 19.09: «ощущение, что там ничего нет». */
.nd-map .dots i em { position: absolute; bottom: 150%; left: 50%; transform: translateX(-50%);

.nd-map .dots i em::after { content: ''; position: absolute; top: 100%; left: 50%;

.nd-map .dots i:hover em { opacity: 1; }
/* Клетка не должна обрезать подсказку. */
.nd-map .cell { overflow: visible; }
.nd-map .cell b { font-size: 11px; font-weight: 700; color: var(--ink-2);

/* Короткая сноска под блоком — только там, где без неё непонятно. */

/* Где продвигаться: номер, знак площадки, имя, полоса, доля. */
/* Единый вид всех списков со значением: знак, имя, полоса, число. Номера

.nd-plan .ico svg { width: 15px; height: 15px; fill: none; stroke: var(--ink-3);
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; }
.nd-plan .nm { font-size: 11.5px; font-weight: 600; color: var(--ink);

  font-variant-numeric: tabular-nums; white-space: nowrap; }
/* Доля внимания — кольцо и список справа. */

/* Два числа под дугой осведомлённости. */

/* Две колонки «выигрываем / проигрываем». */

.nd-vs { display: grid; gap: 16px 22px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }

.nd-vs .row { font-size: 11.5px; color: var(--ink); line-height: 1.4;
