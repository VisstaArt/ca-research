<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Автоперевод страницы браузером переписывает DOM и роняет React (insertBefore NotFoundError) -->
<meta name="google" content="notranslate">
<title>CA Research</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- Токены эталона, НЕ полный стиль отчёта: страничные правила отчёта
     (.card, .main, .side) в инструменте перебивали его собственную
     раскладку — «плашка на плашке» у владелицы 14.09. Блочные стили
     отчёта инструмент подключает сам, с ограничением области .rview. -->
<script>
/* Внутри платформы инструмент следует теме ПЛАТФОРМЫ, а не системе: платформа
   сейчас светлая, а тёмная система переключала рамку в тёмные токены — и
   данные брифа ложились на чёрный фон под светлой жемчужной плашкой. */
try{if(new URLSearchParams(location.search).get('embed')==='1'){
  document.documentElement.setAttribute('data-theme','light');
  /* Внутри платформы рамка НЕ красит свой фон: иначе поверх жемчужного фона
     платформы ложится сплошная плита, и плашка-заголовок читается как
     «плашка на плашке» (владелица 15.09: «вынеси перламутровую отдельно на
     фон, не надо плашка на плашке»). */
  document.documentElement.setAttribute('data-embed','1');
}}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="lib/tokens.css?v=cf9db2aa">
<link rel="stylesheet" href="lib/nacre.css?v=d8b962d4">
<link rel="stylesheet" href="lib/niches.css?v=ea24fecd">
<link rel="stylesheet" href="lib/buttons.css?v=87ce7a93">
<style>
/* Оформление инструмента — ЭТАЛОН, тот же, что у отчёта и платформы
   (lib/report.css подключён выше). Здесь только то, чего в нём нет: поля
   ввода, служебные плашки прогона, подсказки.

   До 14.09 инструмент нёс своё серое оформление двухлетней давности: #f5f5f5,
   синие рамки, плоские таблицы. Владелица открывала платформу и видела его
   внутри перламутровой оболочки — «старая хуйня» дословно, и справедливо. */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); font-size: var(--fs-body); color: var(--ink);
  background: var(--mist-1); line-height: 1.5; }
#root { max-width: 1180px; margin: 0 auto; padding: 26px 24px 70px; }

input, textarea, select {
  font-family: inherit; font-size: var(--fs-small); color: var(--ink);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px;
  background: var(--card-solid); width: 100%; }
input:focus, textarea:focus, select:focus {
  outline: none; border-color: var(--mid);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--mid) 18%, transparent); }
textarea { min-height: 90px; resize: vertical; }

/* Кнопки — конструкция из оболочки: главная графитом, обычная тонкой рамкой
   с мягким градиентом. Синие рамки и плоский серый убраны. */
button { font-family: var(--sans); font-size: var(--fs-base); font-weight: 600;
  color: var(--ink); cursor: pointer; border: 1px solid var(--line);
  border-radius: 12px; padding: 9px 17px;
  background: linear-gradient(180deg, var(--card-solid),
    color-mix(in srgb, var(--card-solid) 93%, var(--ink)));
  transition: background .16s ease, border-color .16s ease; }
button:hover:not(:disabled) { border-color: var(--ink-3); }
button:disabled { opacity: .45; cursor: default; }
.btn-primary { color: #FFFFFF; border: 2px solid #0D0C0A; padding: 8px 16px;
  background: linear-gradient(180deg, #262320, #171512); }
.btn-primary:hover:not(:disabled) { border-color: var(--mid);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--mid) 22%, transparent); }

.card { background: var(--card-solid); border: 1px solid var(--line);
  border-radius: 22px; padding: 22px 24px; margin-bottom: 14px;
  box-shadow: inset 0 1px 0 var(--hi); }

/* Таблицы — одна шапка на весь проект: прописные под волосяной линией. */
table { border-collapse: collapse; width: 100%; font-size: var(--fs-small); }
th { padding: 13px 18px 9px; font-size: var(--fs-label); font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3);
  text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 18px; border-top: 1px solid var(--line-2);
  color: var(--ink-2); vertical-align: middle; }
tr:nth-child(even) td { background: none; }

.tag { display: inline-block; font-size: var(--fs-label); font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.status-bar { position: sticky; top: 0; z-index: 20; padding: 10px 14px;
  border-radius: 14px; margin-bottom: 14px;
  background: color-mix(in srgb, var(--mid) 8%, var(--card-solid));
  border: 1px solid var(--line); font-size: var(--fs-small); }
.timer { font-variant-numeric: tabular-nums; color: var(--ink-3); }
.tooltip-box { position: absolute; z-index: 30; max-width: 320px;
  padding: 12px 14px; border-radius: 14px; background: var(--card-solid);
  border: 1px solid var(--line); font-size: var(--fs-caption);
  color: var(--ink-2); line-height: 1.5;
  box-shadow: 0 18px 34px -22px rgba(45,36,22,.45); }
.info-btn { width: 18px; height: 18px; padding: 0; border-radius: 50%;
  font-size: var(--fs-label); line-height: 1; color: var(--ink-3); }
.info-btn:hover { color: var(--ink); }
.field-label-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
/* Ярлык поля — как все прописные ярлыки эталона: 10px, 700, разрядка .07em.
   Поля брифа выглядели «не в наших шрифтах» ровно потому, что ярлыки жили
   своим кеглем 12.5 — единственные на всю платформу. */
.field-label { font-size: var(--fs-label); font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--ink-3); }
/* Рабочая поверхность этапа: тот же материал, что панель бокового меню
   платформы — владелица сверила цвета, они обязаны совпадать. Шапка-плашка
   стоит отдельно НАД поверхностью, карточки данных лежат на ней. */
.worksurface { background: color-mix(in srgb, var(--card-solid) 88%, transparent);
  border: 1px solid rgba(255,255,255,.7); border-radius: 24px;
  padding: 24px 26px 28px;
  box-shadow: 0 20px 44px -26px rgba(45,36,22,.3), inset 0 1px 0 rgba(255,255,255,.8); }
.worksurface .card { box-shadow: inset 0 1px 0 var(--hi); }
/* Роль колонки «.main» отчёта здесь играет рабочая поверхность. Часть правил
   эталона привязана именно к .main (кегль и отступы заголовков внутри
   карточек) — без этой связки <h2> в карточке остаётся браузерным, вдвое
   крупнее образца, и страница читается как черновик. Значения взяты из
   эталона дословно: .main > .card h2 и его первый-в-карточке случай. */
.worksurface .card h2 { font-size: 16px; font-weight: 600; margin: 26px 0 8px; }
.worksurface .card > h2:first-of-type { margin-top: 2px; }
/* Таблица эталона просит минимум 600px ширины — на узкой рамке её должен
   прокручивать свой контейнер, а не страница. */
.worksurface .tbl { overflow-x: auto; }
/* Приписка под данными не должна сливаться с ними: владелица 15.09 —
   «она сейчас сливается со всеми данными, надо отступ побольше или
   звёздочку». Отбиваем чертой, отступом и знаком-звёздочкой. */
.worksurface .card > .note { margin-top: 20px; padding-top: 13px;
  border-top: 1px solid var(--line-2); padding-left: 20px; position: relative; }
.worksurface .card > .note::before { content: "✳"; position: absolute; left: 0;
  top: 12px; color: var(--acc-ink); font-size: 12px; line-height: 1; }

/* ── Встроенный режим: рамка внутри платформы ──────────────────────────────
   Свой фон и свои поля рамка не рисует — их задаёт платформа. Иначе жемчужная
   плашка лежит на собственной плите инструмента, а не на фоне страницы. */
html[data-embed] body { background: transparent; }
html[data-embed] #root { max-width: none; padding: 0; }
/* Разбор ниши: на узкой рамке круговая и полосы встают друг под друга,
   иначе полосы сжимаются до нечитаемых огрызков. */
@media (max-width: 700px) {
  .ниша-разбор { grid-template-columns: minmax(0, 1fr) !important; }
}

.field-opt { font-size: var(--fs-caption); color: var(--ink-3); text-transform: none; letter-spacing: 0; }
</style>
</head>

</body>
</html>
