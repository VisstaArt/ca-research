/* Тёмная тема пока не доведена — решение владелицы 09.09.2026 отложить её
   отдельным заходом: жемчужная картинка на тёмном не работает, нужен свой
   фон и пересчёт всех цветов. Здесь минимальный рабочий набор, чтобы
   страница не ломалась у тех, у кого система в тёмном режиме. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --mist-1:#1A1815; --mist-2:#0E0C0A;
    --card:#252119cc; --card-solid:#252119; --raise:#2C2820;
    --ink:#F4F1E8; --ink-2:#A6A29A; --ink-3:#A8A49D;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.05);
    --hi:rgba(255,255,255,.06);
    --bgimg:none;
  }
}
:root[data-theme="dark"]{
  --mist-1:#1A1815; --mist-2:#0E0C0A;
  --card:#252119cc; --card-solid:#252119; --raise:#2C2820;
  --ink:#F4F1E8; --ink-2:#A6A29A; --ink-3:#A8A49D;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.05);
  --hi:rgba(255,255,255,.06);
  --bgimg:none;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:14.5px;
  line-height:1.55;font-variant-numeric:tabular-nums;min-height:100vh;
  background:
    radial-gradient(900px 620px at 46% 60%, color-mix(in srgb, var(--mid) 7%, transparent), transparent 62%),
    var(--bgimg) center/cover no-repeat fixed,
    linear-gradient(168deg, var(--mist-1), var(--mist-2));
  transition:background-color .3s}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mid);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em;text-wrap:balance}

/* ── Каркас ── */
.app{display:flex;min-height:100vh;max-width:1500px;margin:0 auto}
.side{width:270px;flex:0 0 270px;padding:20px 14px;margin:14px 0 14px 14px;
  align-self:flex-start;position:sticky;top:14px;
  border-radius:24px;background:color-mix(in srgb, var(--card-solid) 88%, transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 20px 44px -26px rgba(45,36,22,.3), inset 0 1px 0 rgba(255,255,255,.8)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.wrap{width:100%;padding:26px 30px 70px}

/* ── Шапка меню: логотип платформы, под ним контекст клиента ── */
.brand{padding:2px 8px 14px}
.brand img{height:32px;width:auto;display:block}
.brand b,.brand span{display:none} /* старая текстовая версия знака не нужна */
.client{padding:0 8px 14px;display:flex;flex-direction:column}
.client b{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.client i{font-style:normal;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.client .back{align-self:flex-start;margin-top:12px;padding:0;border:0;background:none;
  font-size:12.5px;font-weight:600;color:var(--ink-2);transition:color .15s}
.client .back:hover{color:var(--acc-ink)}

.mods{display:flex;flex-direction:column;gap:2px;padding-top:6px;
  border-top:1px solid var(--line-2);margin-top:4px}
.grp{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:16px 10px 6px}
.grp:first-child{padding-top:6px}
.mod{display:flex;align-items:center;width:100%;text-align:left;border:0;
  background:none;padding:9px 12px;border-radius:12px;color:var(--ink-2);
  font-size:13.5px;font-weight:500;position:relative;transition:background .15s}
.mod:hover:not(:disabled):not([aria-current]){background:color-mix(in srgb, var(--ink) 4%, transparent)}
/* Активный раздел — тёмный графит. Он единственный тёмный элемент страницы,
   поэтому взгляд идёт к нему сам, без цветной подсветки. */
.mod[aria-current="page"]{color:var(--mist-1);font-weight:600;
  background:linear-gradient(150deg, #262320, #171512);
  box-shadow:0 14px 26px -14px rgba(23,21,18,.45), inset 0 1px 0 rgba(255,255,255,.14)}
.mod:disabled{color:var(--ink-3);cursor:default;opacity:.55}
/* Счётчик: число чернилами, бирюза сведена к точке — она лишь отмечает,
   что раздел ждёт решения. */
.mod .cnt{margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:700;color:var(--ink);line-height:1;
  padding-left:9px;border-left:1px solid var(--line)}
.mod .cnt::before{content:"";width:5px;height:5px;border-radius:50%;
  background:var(--mid);flex:0 0 auto}
.mod[aria-current="page"] .cnt{color:var(--mist-1);border-left-color:rgba(255,255,255,.2)}
.mod:disabled .cnt{color:var(--ink-3)}
.mod:disabled .cnt::before{background:var(--ink-3);opacity:.5}
.mod .lock{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--ink-3)}

.foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line-2);
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tbtn{padding:5px 11px;border:1px solid var(--line);border-radius:999px;
  background:var(--card-solid);color:var(--ink-2);font-size:12px;font-weight:500}
.tbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--mist-1)}
.top{display:flex;align-items:center;gap:8px;padding:14px 30px;flex-wrap:wrap}
.top .sp{flex:1}

/* ── Поверхности ── */
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:22px;padding:24px 26px;margin-bottom:16px;
  box-shadow:inset 0 1px 0 var(--hi), 0 14px 30px -24px rgba(45,36,22,.3)}
.card h2{font-size:17px;margin-bottom:4px}
.lede{color:var(--ink-2);font-size:13.5px;margin:0 0 18px}
.hdr{margin-bottom:24px}
.hdr h1{font-size:28px;letter-spacing:-.025em}
.hdr p{margin:7px 0 0;color:var(--ink-2);font-size:14px}

label{display:block;margin-bottom:15px}
label .lab{display:block;margin-bottom:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
label .hint{display:block;margin-top:5px;font-size:12px;color:var(--ink-3)}
input,select{width:100%;padding:10px 13px;border:1px solid var(--line);
  border-radius:12px;background:var(--card-solid);font-size:14px}
input:focus,select:focus{border-color:var(--mid);outline:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--mid) 18%,transparent)}

/* ── Кнопки ──────────────────────────────────────────────────────────────────
   Градиент светлее сверху, глубже снизу — так, как свет падает на выпуклую
   поверхность; за счёт этого кнопка выглядит объёмной, а не наклеенной.
   Оба конца градиента проверены с тёмным текстом: 9.94 и 7.02 при норме 4.5.
   Отклик на нажатие: кнопка проседает на 1px и тень поджимается — короткое
   движение в 90мс, ровно чтобы палец почувствовал ответ. */
.btn{padding:10px 20px;border:1px solid var(--line);border-radius:999px;
  background:var(--card-solid);font-size:13.5px;font-weight:600;
  transition:transform .09s ease, box-shadow .18s ease, background .18s ease,
             border-color .18s ease}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-primary{color:#12100D;border-color:color-mix(in srgb, var(--mid) 70%, black);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--mid) 84%, white),
    color-mix(in srgb, var(--mid) 84%, black));
  box-shadow:0 8px 18px -8px color-mix(in srgb, var(--mid) 70%, transparent),
             inset 0 1px 0 rgba(255,255,255,.55)}
.btn-primary:hover:not(:disabled){
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--mid) 70%, white),
    color-mix(in srgb, var(--mid) 92%, black));
  border-color:color-mix(in srgb, var(--mid) 80%, black);
  box-shadow:0 12px 24px -10px color-mix(in srgb, var(--mid) 80%, transparent),
             inset 0 1px 0 rgba(255,255,255,.6)}
.btn-primary:active:not(:disabled){transform:translateY(1px);
  box-shadow:0 4px 10px -6px color-mix(in srgb, var(--mid) 70%, transparent),
             inset 0 1px 2px rgba(0,0,0,.18)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Плашка «важно»: цвет корешком, текст обычный — цветная надпись не проходит
   по контрасту ни в одном статусном цвете. */
.warn{display:flex;gap:12px;padding:14px 16px;border-radius:14px;
  background:color-mix(in srgb, var(--maybe) 8%, var(--card-solid));
  font-size:13px;line-height:1.55;margin-bottom:16px;color:var(--ink)}
.warn .rule{width:3px;border-radius:2px;background:var(--maybe);flex:0 0 auto}
.warn b{display:block;margin-bottom:2px;color:var(--ink)}

/* ── Плитки клиентов и рынков ── */
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.tile{text-align:left;padding:20px 22px;border-radius:20px;
  background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);transition:.2s cubic-bezier(.2,.8,.2,1);
  box-shadow:inset 0 1px 0 var(--hi), 0 12px 26px -22px rgba(45,36,22,.3)}
.tile:hover{transform:translateY(-2px);border-color:color-mix(in srgb, var(--mid) 40%, var(--line));
  box-shadow:inset 0 1px 0 var(--hi), 0 20px 34px -22px rgba(45,36,22,.4)}
.tile b{display:block;font-size:15.5px;font-weight:700;margin-bottom:3px}
.tile span{display:block;font-size:12.5px;color:var(--ink-3)}
.tile.add{border-style:dashed;color:var(--ink-2);display:flex;align-items:center;
  justify-content:center;min-height:104px;font-size:13.5px;font-weight:600;background:none}
.tile.add:hover{background:color-mix(in srgb, var(--mid) 5%, transparent)}

.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;
  font-size:11.5px;font-weight:600;color:var(--ink)}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.chip-go{background:color-mix(in srgb, var(--go) 12%, var(--card-solid))}
.chip-go .dot{background:var(--go)}
.chip-wait{background:color-mix(in srgb, var(--ink) 5%, var(--card-solid));color:var(--ink-2)}
.chip-wait .dot{background:var(--ink-3)}

.empty{padding:56px 24px;text-align:center;color:var(--ink-3);font-size:14px}
.empty p{max-width:460px;margin:0 auto 20px;line-height:1.65}

/* ── Вход ── */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:100%;max-width:390px;margin:0}
.login .card img{height:30px;width:auto;display:block;margin-bottom:18px}
.err{color:var(--maybe);font-size:13px;margin:10px 0 0;font-weight:600}

@media (max-width:980px){
  .app{flex-direction:column}
  .side{width:auto;flex:none;position:static;margin:12px 12px 0}
  .mods{flex-direction:row;overflow-x:auto;gap:4px}
  .grp{display:none}
  .mod{width:auto;white-space:nowrap}
  .wrap{padding:20px 16px 48px}
  .top{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
