<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Платформа — оболочка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="lib/auth.js"></script>
<script src="lib/migrate.js"></script>
<style>
/* Значения из ДИЗАЙН-ТОКЕНЫ.md. Не править здесь по ходу дела: сначала правка
   в документе и согласование, потом код. Светлая тема задана в голом :root,
   тёмная переопределяет ТОЛЬКО токены — двумя блоками, потому что у темы три
   состояния, а не два: явный выбор ставит атрибут, а системная не ставит
   ничего, и тогда работает только prefers-color-scheme. */
:root{
  --bone:#F0EEE8; --paper:#F8F7F6; --raise:#FEFEFE;
  --ink:#151412; --ink-2:#5A574F; --ink-3:#747168;
  --line:#E0DED7; --line-2:#EEEDEA;
  --clay:#0ABAB5; --clay-deep:#33CEC8;
  --go:#0E8A5F; --go-bg:#EAEDE7;
  --maybe:#BE9722; --maybe-bg:#F3EEE6;
  --no:#A6384E; --no-bg:#F1EAE7;
  --sans:Montserrat,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bone:#151411; --paper:#201F1A; --raise:#2A2823;
    --ink:#ECEBE9; --ink-2:#BBB9B4; --ink-3:#918F87;
    --line:#37352F; --line-2:#2B2924;
    --clay:#A6D8D5; --clay-deep:#0ABAB5;
    --go:#9EBDAD; --go-bg:#1C4631;
    --maybe:#D7C3A0; --maybe-bg:#5F4C1C;
    --no:#CAA3A8; --no-bg:#53242A;
  }
}
:root[data-theme="dark"]{
  --bone:#151411; --paper:#201F1A; --raise:#2A2823;
  --ink:#ECEBE9; --ink-2:#BBB9B4; --ink-3:#918F87;
  --line:#37352F; --line-2:#2B2924;
  --clay:#A6D8D5; --clay-deep:#0ABAB5;
  --go:#9EBDAD; --go-bg:#1C4631;
  --maybe:#D7C3A0; --maybe-bg:#5F4C1C;
  --no:#CAA3A8; --no-bg:#53242A;
}
/* ── Палитра «кокос» (подборка владелицы 08.09.2026) ──────────────────────────
   Тёмная бирюза, кость, песок, светлая бирюза. Годится ЦЕЛИКОМ, но только при
   правиле «цвет — заливка и метка, текст — обычный»: светлая бирюза как текст
   даёт контраст 1.45, песок 1.70. Как заливка кнопки с тёмным текстом — 5.74
   и 4.90, проходят. Тёмная бирюза #214245 работает основным текстом (8.31) и
   фоном тёмной темы. Все значения посчитаны, не подобраны на глаз.

   ВРЕМЕННО: переключатель палитр стоит, пока владелица выбирает. После выбора
   победившая переезжает в :root, проигравшая и переключатель удаляются. */
:root[data-pal="coconut"]{
  --bone:#E5E1D3; --paper:#F2EFE6; --raise:#FAF8F3;
  --ink:#214245; --ink-2:#3C5A5C; --ink-3:#546E70;
  --line:#D8D3C2; --line-2:#E9E5D9;
  --clay:#6ACCC7; --clay-deep:#95DEDA;
  --go:#0E7A55; --go-bg:#DDE6DC;
  --maybe:#B07A2A; --maybe-bg:#EFE6D6;
  --no:#9B3346; --no-bg:#EFDFDC;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"])[data-pal="coconut"]{
    --bone:#1A3336; --paper:#214245; --raise:#2B5155;
    --ink:#E5E1D3; --ink-2:#B9C6C2; --ink-3:#9CB0AE;
    --line:#35595C; --line-2:#2A4C50;
    --clay:#6ACCC7; --clay-deep:#95DEDA;
    --go:#8FBFA6; --go-bg:#1D4536;
    --maybe:#D3A671; --maybe-bg:#4E3D1E;
    --no:#D3A0A6; --no-bg:#4C2830;
  }
}
:root[data-theme="dark"][data-pal="coconut"]{
  --bone:#1A3336; --paper:#214245; --raise:#2B5155;
  --ink:#E5E1D3; --ink-2:#B9C6C2; --ink-3:#9CB0AE;
  --line:#35595C; --line-2:#2A4C50;
  --clay:#6ACCC7; --clay-deep:#95DEDA;
  --go:#8FBFA6; --go-bg:#1D4536;
  --maybe:#D3A671; --maybe-bg:#4E3D1E;
  --no:#D3A0A6; --no-bg:#4C2830;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--sans);
  font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}

/* ── Каркас: меню фиксированной ширины, содержимое тянется во всю ширину окна.
   Потолок 1500px, иначе на широком мониторе строки расползаются нечитаемо. */
.app{display:flex;min-height:100vh}
.side{width:264px;flex:0 0 264px;background:var(--paper);
  border-right:1px solid var(--line);display:flex;flex-direction:column}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1500px;margin:0 auto;padding:32px 40px 64px}

.brand{padding:20px 18px 16px;border-bottom:1px solid var(--line-2)}
.brand b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand span{display:block;margin-top:3px;font-size:12px;color:var(--ink-3)}
.brand .back{display:block;margin-top:12px;padding:0;border:0;background:none;
  font-size:12.5px;color:var(--ink-2);transition:color .15s}
.brand .back:hover{color:var(--clay)}

.mods{padding:12px 10px;flex:1;overflow-y:auto}
.grp{padding:14px 8px 6px;font-size:11px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3)}
.mod{position:relative;display:block;width:100%;text-align:left;
  padding:8px 10px;margin-bottom:1px;border:0;border-radius:7px;background:none;
  font-size:13.5px;color:var(--ink-2);transition:background .15s,color .15s}
.mod:hover:not(:disabled){background:var(--bone);color:var(--ink)}
.mod[aria-current="page"]{background:var(--raise);color:var(--ink);font-weight:500;
  box-shadow:0 1px 2px rgba(0,0,0,.04)}
.mod[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:7px;
  bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--clay)}
.mod:disabled{color:var(--ink-3);cursor:default;opacity:.65}
.mod .cnt{float:right;min-width:18px;padding:0 5px;border-radius:9px;
  background:var(--clay);color:#fff;font-size:11px;font-weight:500;text-align:center}
.mod .lock{float:right;font-size:11px;font-weight:400;color:var(--ink-3)}

.foot{padding:12px 14px;border-top:1px solid var(--line-2);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tbtn{padding:4px 9px;border:1px solid var(--line);border-radius:6px;
  background:var(--bone);color:var(--ink-2);font-size:12px}
.tbtn[aria-pressed="true"]{background:var(--clay);border-color:var(--clay);color:#fff}

/* ── Общее ── */
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:22px 24px;margin-bottom:16px}
.card h2{font-size:17px;margin-bottom:4px}
.lede{color:var(--ink-2);font-size:13.5px;margin:0 0 18px}
.hdr{margin-bottom:24px}
.hdr h1{font-size:24px;letter-spacing:-.02em}
.hdr p{margin:6px 0 0;color:var(--ink-2);font-size:14px}

label{display:block;margin-bottom:14px}
label .lab{display:block;margin-bottom:5px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
label .hint{display:block;margin-top:4px;font-size:12px;color:var(--ink-3)}
input,select{width:100%;padding:9px 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--raise);font-size:14px}
input:focus,select:focus{border-color:var(--clay);outline:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--clay) 18%,transparent)}

.btn{padding:9px 18px;border:1px solid var(--line);border-radius:8px;
  background:var(--raise);font-size:13.5px;font-weight:500;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
/* Тёмный текст, а не белый: белый на бирюзе даёт 2.41 при норме WCAG 4.5,
   тёмный — 7.63. И наведение СВЕТЛЕЕТ: пока оно темнело, тёмный текст на нём
   выглядел грязно, а белый туда не поставить — 3.10, тоже не проходит. */
.btn-primary{background:var(--clay);border-color:var(--clay);color:#151412;font-weight:600}
.btn-primary:hover:not(:disabled){background:var(--clay-deep);border-color:var(--clay-deep)}
:root[data-pal="coconut"] .btn-primary{color:#214245}
.btn:disabled{opacity:.5;cursor:default}
a.btn{display:inline-block;text-decoration:none}

/* Верхняя полоса на внешних экранах: без неё выйти и сменить тему можно было
   бы только внутри рынка — то есть человек, у которого ещё нет ни одного
   клиента, оказался бы заперт. */
.top{display:flex;align-items:center;gap:8px;padding:10px 40px;
  border-bottom:1px solid var(--line);background:var(--paper)}
.top .sp{flex:1}
@media (max-width:980px){ .top{padding:10px 18px} }
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.warn{display:flex;gap:12px;padding:13px 15px;border-radius:10px;
  background:var(--maybe-bg);font-size:13px;line-height:1.55;margin-bottom:16px;
  color:var(--ink)}
.warn .rule{width:3px;border-radius:2px;background:var(--maybe);flex:0 0 auto}
.warn b{display:block;margin-bottom:2px;color:var(--ink)}

/* Метка состояния: цвет точкой, слово обычным текстом. Цветная надпись не
   проходит по контрасту ни в одном из статусных цветов — а точка проходит. */
.chip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.chip-go .dot{background:var(--go)}
.chip-wait .dot{background:var(--ink-3)}

/* ── Плитки клиентов и рынков ── */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.tile{text-align:left;padding:18px 20px;border:1px solid var(--line);border-radius:12px;
  background:var(--paper);transition:.15s}
.tile:hover{border-color:var(--clay);transform:translateY(-1px)}
.tile b{display:block;font-size:15px;font-weight:600;margin-bottom:3px}
.tile span{display:block;font-size:12.5px;color:var(--ink-3)}
.tile.add{border-style:dashed;color:var(--ink-2);display:flex;align-items:center;
  justify-content:center;min-height:96px;font-size:13.5px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:11.5px;font-weight:500}
/* Слово всегда обычным цветом текста: цветная надпись не проходит по контрасту
   ни в одном статусном цвете. Значение несёт точка слева. */
.chip-go{background:var(--go-bg);color:var(--ink)}
.chip-wait{background:var(--bone);color:var(--ink-2);border:1px solid var(--line)}

.empty{padding:56px 24px;text-align:center;color:var(--ink-3);font-size:14px}
.empty p{max-width:440px;margin:0 auto 18px;line-height:1.65}

/* ── Вход ── */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:100%;max-width:380px;margin:0}
.err{color:var(--no);font-size:13px;margin:10px 0 0}

/* ── До 980px меню уезжает наверх горизонтальной лентой ── */
@media (max-width:980px){
  .app{flex-direction:column}
  .side{width:auto;flex:none;border-right:0;border-bottom:1px solid var(--line)}
  .mods{display:flex;gap:4px;overflow-x:auto;padding:8px 10px}
  .grp{display:none}
  .mod{width:auto;white-space:nowrap;margin:0}
  .mod[aria-current="page"]::before{display:none}
  .wrap{padding:24px 18px 48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div id="root"></div>
<script src="shell.js"></script>
